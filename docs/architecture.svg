<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="dst architecture: device I/O, TUI, agent harness, tools, sandbox, model API and ~/.dst state">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #121b25; stroke: #27384a; stroke-width: 1.25; }
      .box-hi { fill: #132430; stroke: #2c6b80; stroke-width: 1.25; }
      .t  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #dfe9f3; }
      .th { font-weight: 600; letter-spacing: .06em; }
      .m  { fill: #7d94a9; }
      .c  { fill: #22d3ee; }
      .a  { stroke: #3b556b; stroke-width: 1.4; fill: none; }
      .ad { stroke: #3b556b; stroke-width: 1.4; fill: none; stroke-dasharray: 4 4; }
      .lbl { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #64809a; font-size: 10.5px; letter-spacing: .08em; }
    </style>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b556b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="600" rx="16"/>

  <!-- title -->
  <text class="t th c" x="60" y="52" font-size="16">DST / ARCHITECTURE</text>
  <text class="t m" x="60" y="76" font-size="12.5">one process · zero crates · a turn/step driver with a permissioned tool pipeline</text>

  <!-- row 1: device io + tui + panel -->
  <rect class="box" x="55" y="112" width="250" height="92" rx="10"/>
  <text class="t th" x="180" y="143" font-size="14" text-anchor="middle">CARDPUTER ZERO</text>
  <text class="t m" x="180" y="164" font-size="12.5" text-anchor="middle">keyboard · fn/sym layers</text>
  <text class="t m" x="180" y="182" font-size="12.5" text-anchor="middle">push-to-talk · pty stdin</text>

  <rect class="box-hi" x="345" y="112" width="510" height="92" rx="10"/>
  <text class="t th c" x="600" y="143" font-size="14.5" text-anchor="middle">TUI  ·  main.rs</text>
  <text class="t m" x="600" y="164" font-size="12.5" text-anchor="middle">53×12 framebuffer, markdown, reasoning panel, artifacts</text>
  <text class="t m" x="600" y="182" font-size="12.5" text-anchor="middle">palette · menuconfig wizard · /resume · approval screens</text>

  <rect class="box" x="895" y="112" width="250" height="92" rx="10"/>
  <text class="t th" x="1020" y="143" font-size="14" text-anchor="middle">PANEL 320×170</text>
  <text class="t m" x="1020" y="164" font-size="12.5" text-anchor="middle">fbterm on the device</text>
  <text class="t m" x="1020" y="182" font-size="12.5" text-anchor="middle">or a pty in tools/sim</text>

  <line class="a" x1="305" y1="158" x2="341" y2="158" marker-end="url(#arw)"/>
  <line class="a" x1="855" y1="158" x2="891" y2="158" marker-end="url(#arw)"/>

  <!-- row 2: harness -->
  <rect class="box-hi" x="345" y="258" width="510" height="100" rx="10"/>
  <text class="t th c" x="600" y="288" font-size="14.5" text-anchor="middle">HARNESS  ·  harness.rs</text>
  <text class="t m" x="600" y="309" font-size="12.5" text-anchor="middle">turn → step (one request + its tool batch) → next step</text>
  <text class="t m" x="600" y="327" font-size="12.5" text-anchor="middle">goal rounds · compaction · clock + context injection</text>
  <text class="t m" x="600" y="345" font-size="12.5" text-anchor="middle">tool/call → sandbox gate → execute → tool/result</text>

  <line class="a" x1="600" y1="204" x2="600" y2="254" marker-end="url(#arw)"/>
  <line class="a" x1="600" y1="358" x2="600" y2="404" marker-end="url(#arw)"/>

  <!-- row 3: tools / sandbox / model / state -->
  <rect class="box" x="55" y="408" width="250" height="104" rx="10"/>
  <text class="t th" x="180" y="436" font-size="14" text-anchor="middle">TOOLS  ·  tools.rs</text>
  <text class="t m" x="180" y="457" font-size="12.5" text-anchor="middle">bash · read/write · web</text>
  <text class="t m" x="180" y="475" font-size="12.5" text-anchor="middle">skill · artifact · cron</text>
  <text class="t m" x="180" y="493" font-size="12.5" text-anchor="middle">apps · goal · MCP</text>

  <rect class="box" x="345" y="408" width="250" height="104" rx="10"/>
  <text class="t th" x="470" y="436" font-size="14" text-anchor="middle">SANDBOX  ·  sandbox.rs</text>
  <text class="t m" x="470" y="457" font-size="12.5" text-anchor="middle">auto · strict · full</text>
  <text class="t m" x="470" y="475" font-size="12.5" text-anchor="middle">safe rules + LLM judge</text>
  <text class="t m" x="470" y="493" font-size="12.5" text-anchor="middle">denials become results</text>

  <rect class="box" x="645" y="408" width="250" height="104" rx="10"/>
  <text class="t th" x="770" y="436" font-size="14" text-anchor="middle">MODEL  ·  api.rs</text>
  <text class="t m" x="770" y="457" font-size="12.5" text-anchor="middle">streamed SSE over curl</text>
  <text class="t m" x="770" y="475" font-size="12.5" text-anchor="middle">DSH token or API key</text>
  <text class="t m" x="770" y="493" font-size="12.5" text-anchor="middle">HTTPS only · prefix cache</text>

  <rect class="box" x="945" y="408" width="200" height="104" rx="10"/>
  <text class="t th" x="1045" y="436" font-size="14" text-anchor="middle">STATE ~/.dst</text>
  <text class="t m" x="1045" y="457" font-size="12.5" text-anchor="middle">config.yml 0600</text>
  <text class="t m" x="1045" y="475" font-size="12.5" text-anchor="middle">sessions · skills</text>
  <text class="t m" x="1045" y="493" font-size="12.5" text-anchor="middle">apps · jobs · logs</text>

  <line class="a" x1="560" y1="358" x2="470" y2="404" marker-end="url(#arw)"/>
  <line class="a" x1="640" y1="358" x2="730" y2="404" marker-end="url(#arw)"/>
  <line class="a" x1="345" y1="460" x2="309" y2="460" marker-end="url(#arw)"/>
  <line class="a" x1="595" y1="460" x2="641" y2="460" marker-end="url(#arw)"/>
  <line class="ad" x1="899" y1="460" x2="941" y2="460" marker-end="url(#arw)"/>

  <text class="lbl" x="600" y="548" text-anchor="middle">EVERY CALL:  tool/call → pre-execute → sandbox gate → execute → post-execute → tool/result (+ additionalContexts)</text>
  <text class="lbl" x="600" y="570" text-anchor="middle">MODULES: harness · tool · tools · compact · context · goal · session · sandbox · bg · api · config · cmd · apps · mcp</text>
</svg>
