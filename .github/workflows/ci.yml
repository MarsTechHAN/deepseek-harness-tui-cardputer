name: ci

# Compile + test on every push/PR, then publish binaries:
#   * every push to main  -> rolling "nightly" pre-release (one release, assets
#     overwritten on each commit)
#   * a pushed vX.Y.Z tag -> a versioned release (tag must match Cargo.toml)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------
  # Fast gate: release build + unit tests + a simulator smoke test.
  # Runs on every push and pull request.
  # ---------------------------------------------------------------------
  build-and-test:
    name: build + unit tests + simulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release, LTO)
        run: cargo build --release --locked

      - name: Unit tests
        continue-on-error: true
        run: |
          set +e
          cargo test --locked --no-fail-fast 2>&1 | tee /tmp/test.log
          exit 0

      - name: Unit test summary
        if: always()
        run: |
          set -euo pipefail
          if grep -qE 'test result: FAILED' /tmp/test.log; then
            {
              echo "### Unit tests"
              echo
              echo "| failed test |"
              echo "| --- |"
              grep -E '^test .* FAILED$' /tmp/test.log | sed -E 's/^test ([^ ]+) .*/| `\1` |/'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '^test .* FAILED$' /tmp/test.log | sed -E 's/^test ([^ ]+) .*/::error title=failed unit test::\1/'
            exit 1
          fi
          echo "unit tests passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug binary for the simulator
        run: cargo build --locked

      - name: Report binary size
        run: |
          ls -lh target/release/dst
          echo "binary: $(stat -c%s target/release/dst) bytes"

      - name: Set up Python for the simulator
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install simulator dependencies
        run: python3 -m pip install --quiet pyte pillow

      - name: Simulator demo (device-fidelity renderer)
        run: |
          cd tools/sim
          timeout 300 python3 run_demo.py

      - name: Simulator smoke scenarios
        run: |
          cd tools/sim
          DST_SCENARIO_TIMEOUT=120 timeout 900 python3 run_scenarios.py \
            progress job_manager rewind rewind_prompt btw_side_question \
            image_input read_image_tool creator_build update_hwinfo

  # ---------------------------------------------------------------------
  # Full regression: all checked simulator scenarios. Publishing paths only
  # (main or a version tag), so pull requests stay quick.
  # ---------------------------------------------------------------------
  full-scenarios:
    name: full simulator scenarios (advisory)
    needs: build-and-test
    # Main pushes only: tag releases reuse the commit main already checked,
    # and the whole suite is a ~20 minute job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build debug binary for the simulator
        run: cargo build --locked

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install simulator dependencies
        run: python3 -m pip install --quiet pyte pillow

      - name: All simulator scenarios
        continue-on-error: true
        run: |
          cd tools/sim
          set +e
          DST_SCENARIO_TIMEOUT=180 timeout 2700 python3 run_scenarios.py 2>&1 | tee /tmp/scen.log
          exit 0

      - name: Scenario summary
        if: always()
        run: |
          set -euo pipefail
          total=$(grep -cE '^\[PASS\]' /tmp/scen.log || true)
          awk '
            /^\[FAIL\] / {
              name=$0
              sub(/^\[FAIL\] /, "", name)
              sub(/ \(.*$/, "", name)
              scen=name
              next
            }
            /^  FAIL / {
              label=$0
              sub(/^  FAIL /, "", label)
              print scen "\t" label
            }
          ' /tmp/scen.log > /tmp/failing-checks.tsv || true
          {
            echo "### Simulator scenarios"
            echo
            echo "passed: ${total:-0} / 96"
            if [ -s /tmp/failing-checks.tsv ]; then
              echo
              echo "| scenario | failing check |"
              echo "| --- | --- |"
              awk -F '\t' '{printf "| `%s` | %s |\n", $1, $2}' /tmp/failing-checks.tsv
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # One annotation per failing check on the run page.
          while IFS=$'\t' read -r scen label; do
            [ -n "$scen" ] || continue
            echo "::error title=scenario $scen:: $label"
          done < /tmp/failing-checks.tsv || true

  # ---------------------------------------------------------------------
  # Release binaries: native x86_64 Linux + cross-compiled aarch64 (the
  # Cardputer Zero target). Same flags as tools/deploy/deploy.sh but using
  # Ubuntu's cross gcc instead of the host zig wrapper.
  # ---------------------------------------------------------------------
  binaries:
    name: release binaries (${{ matrix.arch }})
    needs: build-and-test
    if: github.event_name == 'push'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Add the aarch64 target
        if: matrix.arch == 'aarch64'
        run: |
          rustup target add "${{ matrix.target }}"
          rustup target list --installed

      # zig cc is the cross linker used by tools/deploy/deploy.sh; it bundles
      # the aarch64 glibc/sysroot so the runner needs no cross toolchain.
      - name: Setup zig
        if: matrix.arch == 'aarch64'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Build (x86_64)
        if: matrix.arch == 'x86_64'
        run: cargo build --release --locked

      - name: Build (aarch64)
        if: matrix.arch == 'aarch64'
        run: |
          set -euo pipefail
          rustc --version
          wrapper="$RUNNER_TEMP/zig-cc"
          printf '#!/bin/sh\nexec zig cc -target aarch64-linux-gnu "$@"\n' > "$wrapper"
          chmod +x "$wrapper"
          if CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="$wrapper" \
              cargo build --release --locked --target "${{ matrix.target }}"; then
            exit 0
          fi
          echo "::warning::zig link failed; retrying with the Ubuntu cross gcc"
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo build --release --locked --target "${{ matrix.target }}"

      - name: Collect + verify the artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            src="target/${{ matrix.target }}/release/dst"
            out="dist/dst-linux-aarch64"
          else
            src="target/release/dst"
            out="dist/dst-linux-x86_64"
          fi
          cp "$src" "$out"
          chmod +x "$out"
          file "$out"
          case "$(file -b "$out")" in
            *"ELF 64-bit"*) ;;
            *) echo "not an ELF64 binary: $out" >&2; exit 1 ;;
          esac
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            file -b "$out" | grep -q "aarch64" || { echo "not aarch64" >&2; exit 1; }
          else
            "$out" --version
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dst-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # Nightly: one rolling pre-release on the "nightly" tag, overwritten on
  # every commit to main (its assets always describe the latest main).
  # ---------------------------------------------------------------------
  nightly:
    name: publish nightly release
    needs: binaries
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: nightly-release
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dst-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum dst-linux-x86_64 dst-linux-aarch64 > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        env:
          COMMIT: ${{ github.sha }}
          SHORT: ${{ github.sha }}
        run: |
          {
            echo "Automated **nightly** build of \`${SHORT:0:12}\` (rolling release: these assets are replaced on every commit to \`main\`)."
            echo
            echo "- built from: https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT}"
            echo "- date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- checks: \`cargo test\` and the simulator smoke set on every PR/push; the full scenario suite runs alongside this build"
            echo "- run \`dst --version\` to identify a build"
            echo
            echo "| asset | target |"
            echo "| --- | --- |"
            echo "| \`dst-linux-x86_64\` | Linux x86_64 |"
            echo "| \`dst-linux-aarch64\` | Linux aarch64 (Cardputer Zero / Raspberry Pi CM0) |"
            echo
            echo "Both binaries are stripped, size-optimised (LTO, \`opt-level=z\`), and need a recent glibc (Ubuntu 24.04 build; Debian 13 on the device)."
          } > notes.md

      - name: Replace the rolling nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # One release, overwritten: drop the previous nightly tag+release first.
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Nightly build ($(date -u +%Y-%m-%d))" \
            --notes-file notes.md \
            dist/dst-linux-x86_64 dist/dst-linux-aarch64 dist/SHA256SUMS

  # ---------------------------------------------------------------------
  # Official release: only for vX.Y.Z tags, and the tag must match the
  # Cargo.toml version (so a release cannot ship a mislabelled build).
  # ---------------------------------------------------------------------
  release:
    name: publish versioned release
    needs: binaries
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dst-*
          merge-multiple: true

      - name: Tag must match Cargo.toml
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag cargo=$version"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match Cargo.toml version v$version"
            exit 1
          fi

      - name: Checksums
        run: |
          cd dist
          sha256sum dst-linux-x86_64 dst-linux-aarch64 > SHA256SUMS
          cat SHA256SUMS

      - name: Verify the host binary
        run: |
          chmod +x dist/dst-linux-x86_64
          dist/dst-linux-x86_64 --version
          file dist/dst-linux-aarch64

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "dst ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/dst-linux-x86_64 dist/dst-linux-aarch64 dist/SHA256SUMS
